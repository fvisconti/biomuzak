name: CI

# CI runs the same commands a developer runs. That is the whole design: if the
# pipeline is green and the laptop is red, the two have diverged and the
# divergence is the bug — never a reason to special-case CI.
#
# Four independent jobs, one per surface:
#   1. test-backend         — Go unit suite (offline, go-sqlmock, httptest) + race.
#   2. test-audio-processor — Python pytest for the embedding microservice.
#   3. test-frontend        — React/Vite test + build.
#   4. build-docker         — build the three images from a clean checkout.

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Cancel superseded runs on the same ref: a stale green build is worse than no
  # build at all, because it looks like proof.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Fail fast instead of silently downloading a second toolchain. If the CI
  # image and go.mod disagree on the Go version, that disagreement is the
  # defect we want surfaced, not papered over.
  GOTOOLCHAIN: local

jobs:
  test-backend:
    name: Test Go Backend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: vet
        run: go vet ./...

      - name: Run tests
        run: go test -v -race -coverprofile=coverage.out ./...

      - name: Generate coverage report
        run: go tool cover -html=coverage.out -o coverage.html

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.html

  test-audio-processor:
    name: Test Audio Processor
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        working-directory: ./audio-processor
        run: |
          pip install uv
          uv pip install --system ".[test]"
          pip install pytest

      - name: Run tests
        working-directory: ./audio-processor
        run: pytest -v

  test-frontend:
    name: Test Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run tests (verbose)
        working-directory: ./frontend
        run: |
          node -v
          npm -v
          CI=true npm test -- --watchAll=false --runInBand --verbose

      - name: Build
        working-directory: ./frontend
        run: npm run build

  build-docker:
    name: Build Docker Images
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: biomuzak-backend:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: biomuzak-frontend:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build audio processor image
        uses: docker/build-push-action@v6
        with:
          context: ./audio-processor
          file: ./audio-processor/Dockerfile
          push: false
          tags: biomuzak-audio-processor:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
