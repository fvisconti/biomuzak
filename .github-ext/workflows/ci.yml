name: CI

# CI calls the same Make targets a developer calls. That is the whole design: if
# the pipeline is green and the laptop is red, the two have diverged and the
# divergence is the bug — never a reason to special-case CI.
#
# Two failure classes this workflow exists to catch, because neither is visible
# in a passing test run:
#   1. The image builds but cannot run (wrong CMD, non-root user without access,
#      binary built for another arch). Caught by booting it against a dead
#      database and asserting the *expected* fast failure.
#   2. The route table and `openapi.json` drift apart. Caught by `make verify`'s
#      bidirectional route/spec check, which is a real test, not a lint rule.

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Cancel superseded runs on the same ref: a stale green build is worse than no
  # build at all, because it looks like proof.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Fail fast instead of silently downloading a second toolchain. If the CI
  # image and go.mod disagree on the Go version, that disagreement is the
  # defect we want surfaced, not papered over.
  GOTOOLCHAIN: local

jobs:
  verify:
    name: Build, vet, lint, test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # Every step below is a Make target, in the same order as `make verify`.
      # Adding a guard to `verify` means adding a step here in the same commit;
      # the composite target is deliberately not used as a single opaque step,
      # because that is how a pipeline silently stops running the guards added
      # after it was written.
      - name: formatting
        run: make fmt-check

      - name: vet
        run: make vet

      - name: lint
        run: make lint

      - name: unit tests
        run: make test

      - name: route and spec are in sync
        run: make check-routes

      - name: no raw goroutines
        run: make check-goroutines

      - name: no god-files
        run: make check-hotspots

      - name: docs gate
        run: make docs-check

      - name: knob registry and generated docs agree
        run: make check-knobs

      - name: race detector
        run: make test-race

  integration:
    name: Integration (live PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      db:
        image: tensorchord/vchord-suite:pg18-latest
        env:
          POSTGRES_USER: mkgs_owner
          POSTGRES_PASSWORD: ci_only_password
          POSTGRES_DB: mkgs
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U mkgs_owner -d mkgs"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: migrate
        env:
          MIGRATION_DATABASE_URL: postgres://mkgs_owner:ci_only_password@localhost:5432/mkgs?sslmode=disable
          MKGS_DB_APP_PASSWORD: ci_only_app_password
        # `migrate` also provisions the app role (FORCE RLS) from
        # MKGS_DB_APP_PASSWORD. A SQL migration cannot do that without the
        # password landing in version control, so the step is Go code and this
        # is where CI supplies the credential.
        run: make migrate-up

      - name: integration tests
        env:
          DATABASE_URL: postgres://mkgs_app:ci_only_app_password@localhost:5432/mkgs?sslmode=disable
          MIGRATION_DATABASE_URL: postgres://mkgs_owner:ci_only_password@localhost:5432/mkgs?sslmode=disable
          MKGS_INTEGRATION_REQUIRED: "1"
        # `make test-int` skips itself when no database answers, which is right
        # for a laptop and wrong here, where the service container guarantees
        # one. MKGS_INTEGRATION_REQUIRED turns that skip into a failure so the
        # suite cannot silently disappear from the pipeline.
        run: make test-int

      - name: retrieval evaluation baseline
        env:
          DATABASE_URL: postgres://mkgs_app:ci_only_app_password@localhost:5432/mkgs?sslmode=disable
          MIGRATION_DATABASE_URL: postgres://mkgs_owner:ci_only_password@localhost:5432/mkgs?sslmode=disable
          MKGS_INTEGRATION_REQUIRED: "1"
        # Retrieval quality is a build artifact, not a matter of taste. The
        # harness ingests the generated corpus with RLS policies active and
        # compares recall@k and latency against the recorded baseline; a
        # regression past the tolerance fails here, where a human would
        # otherwise have to remember to look.
        run: make eval

  docker:
    name: Container build and boot
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Build only — no push, no registry credentials. This job answers one
      # question: does the image build from a clean checkout?
      - name: docker build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: magentia-knowledge-graph-service:ci

      - name: image fails fast on an unreachable database
        run: |
          # A build that produces an image unable to execute its own CMD is
          # still broken. Boot without a database and assert the binary ran and
          # reported the missing dependency — the expected, correct failure.
          set +e
          output=$(docker run --rm \
            -e DATABASE_URL='postgres://x:x@127.0.0.1:1/x?sslmode=disable' \
            -e AUTH_JWKS_URL='http://127.0.0.1:1/.well-known/jwks.json' \
            -e AUTH_ISSUER='https://issuer.invalid' \
            -e AUTH_AUDIENCE='mkgs' \
            -e ROUTER_URL='http://127.0.0.1:1' \
            -e ROUTER_AUTH='ci-only-not-a-real-secret' \
            magentia-knowledge-graph-service:ci 2>&1)
          status=$?
          set -e
          echo "$output"
          if [ "$status" -eq 0 ]; then
            echo "::error::container exited 0 with an unreachable database (should fail fast)"
            exit 1
          fi
          echo "$output" | grep -qi 'database' \
            || { echo "::error::container did not report the database failure"; exit 1; }

      - name: image runs as the non-root uid
        run: |
          # The Dockerfile states uid 65532; this reads it back from the image
          # rather than trusting the file. `docker inspect` needs no shell in
          # the image, which matters because the runtime is distroless.
          uid=$(docker inspect --format '{{.Config.User}}' magentia-knowledge-graph-service:ci)
          echo "image user: $uid"
          [ "$uid" = "65532:65532" ] \
            || { echo "::error::image does not run as 65532:65532 (got $uid)"; exit 1; }

      - name: admin UI and spec are present in the image
        run: |
          # The admin UI is served from disk, and the spec is the contract. Either
          # missing is a runtime 404 that no unit test sees. Files are read out of
          # a created container because the distroless image has no shell to test
          # them from the inside.
          docker create --name mkgs-ci-check magentia-knowledge-graph-service:ci >/dev/null
          trap 'docker rm -f mkgs-ci-check >/dev/null 2>&1 || true' EXIT
          for f in /app/static/admin /app/migrations /app/openapi.json /mkgs; do
            docker cp "mkgs-ci-check:$f" - >/dev/null \
              || { echo "::error::missing in image: $f"; exit 1; }
          done
